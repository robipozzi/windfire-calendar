user: pi
group: pi
local_home_dir: "{{ lookup('env', 'HOME') }}"
local_ssl_dir: "{{ local_home_dir }}/opt/windfire/ssl"
local_truststore_dir: "{{ local_ssl_dir }}/truststore"
local_certs_dir: "{{ local_ssl_dir }}/certs/raspberry"
remote_home_dir: /home/pi
remote_ssl_dir: "{{ remote_home_dir }}/opt/windfire/ssl"
remote_keystore_dir: "{{ remote_ssl_dir }}/keystore"
remote_truststore_dir: "{{ remote_ssl_dir }}/truststore"
windfire_ca_root_certificate: "WindfireRootCA.crt"
windfire_server_certificate: "windfire-calendar.crt"
windfire_server_key: "windfire-calendar.key"
remote_windfire_calendar_dir: "{{ remote_home_dir }}/windfire-calendar"
venv_path: "{{ remote_windfire_calendar_dir }}/app/windfire-calendar"
python_interpreter: "python3"
install_python_modules_script: installPrereqs.sh
run_server_script: run-apicalendar.sh
stop_server_script: stop-apicalendar.sh
process: calendarApiServer.py
env: 3
# systemd service and application (.env) configuration
service_name: windfire-calendar
app_name: Windfire Calendar Service API
api_port: 8000
api_port_secure: 8443
allowed_hosts: raspberry02,localhost
health_check_host: raspberry02
log_level: INFO
log_file: logs/windfire_calendar.log
log_backup_count: 7
log_rotation_when: midnight
log_rotation_interval: 1
