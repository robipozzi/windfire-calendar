---
# Windfire Calendar deployment tasks, shared by windfire-calendar-deploy.yaml and windfire-calendar-full-deploy.yaml.
# The play runs with become (root): tasks that write under the pi home folder either set owner/group
# or run as the connecting user with "become: false", so parent folders are never created as root.
# The application is staged as pi (rsync, venv and pip run as the connecting user), then the whole
# application folder is handed over to the service user before the service starts.

# Task 0: Check that deploy.sh exported the Windfire Security configuration
- name: Check Windfire Security configuration is set
  ansible.builtin.assert:
    that:
      - windfire_security_host | length > 0
      - windfire_security_port | length > 0
      - windfire_security_service | length > 0
    fail_msg: "WINDFIRE_SECURITY_HOST, WINDFIRE_SECURITY_PORT and WINDFIRE_SECURITY_SERVICE must be exported (run deployment/deploy.sh)"
    quiet: true
  no_log: true

# Check that the Google OAuth files exist locally before touching the Pi (they are encrypted in Task 8)
- name: Check Google OAuth files exist locally in app/
  ansible.builtin.stat:
    path: "{{ src_dir }}/../../app/{{ item }}"
  loop:
    - credentials.json
    - token.json
  register: google_files
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail if a Google OAuth file is missing locally
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      app/{{ item.item }} is missing locally. Download credentials.json from Google Cloud Console into app/,
      then run the app locally once (cd app && ./run-calendar.sh) to complete the OAuth consent and create token.json
    quiet: true
  loop: "{{ google_files.results }}"
  loop_control:
    label: "app/{{ item.item }}"
  run_once: true

# Task 0b: Create the system user the service runs as
- name: Create "{{ service_group }}" system group
  ansible.builtin.group:
    name: "{{ service_group }}"
    system: yes
    state: present

- name: Create "{{ service_user }}" system user (no login shell, no supplementary groups)
  ansible.builtin.user:
    name: "{{ service_user }}"
    group: "{{ service_group }}"
    groups: ""
    append: no
    system: yes
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: no
    state: present

# {{ remote_home_dir }} is 0700: let the service user traverse it (no read/list) to reach the application folder
- name: Allow "{{ service_user }}" to traverse {{ remote_home_dir }}
  ansible.posix.acl:
    path: "{{ remote_home_dir }}"
    entity: "{{ service_user }}"
    etype: user
    permissions: x
    state: present

# Task 0c: Check the shared CA certificates before the running service is touched: windfire-raspberry
# (deploy-windfire-ca.sh) owns {{ windfire_ca_dir }}, this playbook never writes it.
# The service trusts the Windfire Root CA (ROOT_CA_PATH in the systemd unit), and so does the health check.
- name: Check the shared CA folder {{ windfire_ca_dir }} and certificates
  stat:
    path: "{{ item }}"
  loop:
    - "{{ windfire_ca_dir }}"
    - "{{ windfire_ca_dir }}/{{ windfire_ca_root_certificate }}"
  register: windfire_ca_stat

- name: Fail if the shared CA folder or a CA certificate is missing or writable by anyone but root
  fail:
    msg: >-
      {{ item.item }} on {{ inventory_hostname }} is missing or not root:root
      {{ '0755' if item.item == windfire_ca_dir else '0644' }}: run deploy-windfire-ca.sh in windfire-raspberry first
  when: >-
    not item.stat.exists
    or item.stat.pw_name != 'root' or item.stat.gr_name != 'root'
    or (item.item == windfire_ca_dir and (not item.stat.isdir or item.stat.mode != '0755'))
    or (item.item != windfire_ca_dir and (not item.stat.isreg or item.stat.mode != '0644'))
  loop: "{{ windfire_ca_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check each CA certificate in {{ windfire_ca_dir }} is a valid certificate
  command: "openssl x509 -noout -in {{ windfire_ca_dir }}/{{ item }}"
  changed_when: false
  check_mode: false
  loop:
    - "{{ windfire_ca_root_certificate }}"

# Task 1: Stop Windfire Calendar service on remote server
- name: Stop "{{ service_name }}" systemd service if running
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    state: stopped
  failed_when: false

# Fallback for processes started by hand with start-apicalendar*.sh before the systemd service existed
- name: Get PID for running process "{{ process }}"
  shell: "pgrep -f {{ process }}"
  register: app_pid
  failed_when: app_pid.rc > 1
  changed_when: false

- name: Kill "{{ process }}" process gracefully
  shell: "kill -TERM {{ item }}"
  with_items: "{{ app_pid.stdout_lines }}"
  when: app_pid.rc == 0
  register: kill_result
  failed_when:
    - kill_result.rc != 0
    - '"No such process" not in kill_result.stderr'

- name: Wait for "{{ process }}" process graceful termination
  wait_for:
    path: "/proc/{{ item }}/status"
    state: absent
  with_items: "{{ app_pid.stdout_lines }}"
  when: app_pid.rc == 0
  ignore_errors: yes

# Task 2: Recreate Windfire Calendar directory on remote server
- name: Remove "{{ remote_windfire_calendar_dir }}" folder and all its contents on remote server
  ansible.builtin.file:
    path: "{{ remote_windfire_calendar_dir }}"
    state: absent

- name: Create "{{ remote_windfire_calendar_dir }}" folder on remote server
  ansible.builtin.file:
    path: "{{ remote_windfire_calendar_dir }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

# Task 3: Copy Windfire Calendar server component to remote server
# .env is templated (Task 4), Google files are never copied (they are encrypted in Task 8), logs are created below
- name: Copy Windfire Calendar server component to "{{ remote_windfire_calendar_dir }}" directory on remote server
  ansible.builtin.synchronize:
    src: "{{ src_dir }}/../../app"
    dest: "{{ remote_windfire_calendar_dir }}"
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=ssl/windfire-calendar.crt"
      - "--exclude=ssl/windfire-calendar.key"
      - "--exclude=windfire-calendar"
      - "--exclude=.env_PLACEHOLDER"
      - "--exclude=windfire-calendar.log*"
      - "--exclude=.env"
      - "--exclude=logs"
      - "--exclude=token.json"
      - "--exclude=credentials.json"
  become: false

# The service user's own TLS folder: only it can enter it
- name: Make "{{ remote_windfire_calendar_dir }}/app/ssl" folder accessible only by {{ service_user }}
  ansible.builtin.file:
    path: "{{ remote_windfire_calendar_dir }}/app/ssl"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0500"

- name: Create "{{ remote_windfire_calendar_dir }}/app/logs" directory on remote server
  ansible.builtin.file:
    path: "{{ remote_windfire_calendar_dir }}/app/logs"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "0755"

# Task 4: Template application configuration (non-secret values only)
- name: Template "{{ remote_windfire_calendar_dir }}/app/.env" configuration file
  ansible.builtin.template:
    src: "{{ src_dir }}/templates/windfire-calendar.env.j2"
    dest: "{{ remote_windfire_calendar_dir }}/app/.env"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0600"

# Task 5: Remove plaintext Google OAuth files left by older deployments, then copy TLS material to remote server:
# the service user's own copy of its certificate and key. The Windfire Root CA is not copied: the service reads
# the shared {{ windfire_ca_dir }} (ROOT_CA_PATH in the systemd unit)
# credentials.json and token.json are encrypted with systemd-creds in Task 8 and never stored in plaintext on the Pi
- name: Remove plaintext Google OAuth files from "{{ remote_windfire_calendar_dir }}/app" on remote server, if any
  file:
    path: "{{ remote_windfire_calendar_dir }}/app/{{ item }}"
    state: absent
  loop:
    - credentials.json
    - token.json

- name: Copy certificate {{ windfire_server_certificate }} from {{ local_certs_dir }} to "{{ remote_windfire_calendar_dir }}/app/ssl" directory on remote server
  copy:
    src: "{{ local_certs_dir }}/{{ windfire_server_certificate }}"
    dest: "{{ remote_windfire_calendar_dir }}/app/ssl/{{ windfire_server_certificate }}"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0444"

- name: Copy key {{ windfire_server_key }} from {{ local_certs_dir }} to "{{ remote_windfire_calendar_dir }}/app/ssl" directory on remote server
  copy:
    src: "{{ local_certs_dir }}/{{ windfire_server_key }}"
    dest: "{{ remote_windfire_calendar_dir }}/app/ssl/{{ windfire_server_key }}"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0400"

# Task 6: Copy common.sh to remote server (app scripts source ../common.sh)
- name: Copy common.sh to "{{ remote_windfire_calendar_dir }}" directory on remote server
  copy:
    src: "{{ src_dir }}/../../common.sh"
    dest: "{{ remote_windfire_calendar_dir }}/common.sh"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: "{{ mode }}"

# Task 7: Copy custom Python module, create Python virtual environment and install required Python modules
- name: Copy custom Python module directory to "{{ remote_home_dir }}" directory on remote server
  ansible.builtin.synchronize:
    src: "{{ src_dir }}/../../../windfire-security-client/dist"
    dest: "{{ remote_home_dir }}"
  become: false

- name: Create Python virtual environment
  command:
    cmd: "{{ python_interpreter }} -m venv {{ venv_path }}"
    creates: "{{ venv_path }}/bin/activate"
  become: false

- name: Verify virtualenv is properly configured
  shell:
    cmd: "source {{ venv_path }}/bin/activate && python --version"
    executable: /bin/bash
  register: python_version
  changed_when: false
  become: false

- name: Display Python version in virtualenv
  debug:
    msg: "Python version in virtualenv: {{ python_version.stdout }}"

- name: Install required Python modules in virtualenv by running {{ install_python_modules_script }} install script
  shell: |
    source {{ venv_path }}/bin/activate
    bash ./{{ install_python_modules_script }} {{ env }}
  args:
    executable: /bin/bash
    chdir: "{{ remote_windfire_calendar_dir }}/app"
  become: false

- name: List installed packages in virtualenv
  shell:
    cmd: "{{ venv_path }}/bin/pip list"
  register: pip_list
  changed_when: false
  become: false

- name: Display installed packages
  debug:
    var: pip_list.stdout_lines

# Task 7b: Hand the application folder over to the service user (owner/group only: file modes are kept)
- name: Change owner of "{{ remote_windfire_calendar_dir }}" and its contents to {{ service_user }}
  ansible.builtin.file:
    path: "{{ remote_windfire_calendar_dir }}"
    state: directory
    recurse: yes
    owner: "{{ service_user }}"
    group: "{{ service_group }}"

# Task 8: Encrypt the Google OAuth files at rest with systemd-creds (plaintext never written to disk)
- name: Ensure /etc/credstore.encrypted directory exists
  file:
    path: /etc/credstore.encrypted
    state: directory
    owner: root
    group: root
    mode: "0700"

# Older deployments stored a Keycloak client secret here that the application never used
- name: Remove obsolete encrypted secrets credential, if any
  file:
    path: "/etc/credstore.encrypted/{{ service_name }}-secrets"
    state: absent

# Google OAuth client (credentials.json) and token (token.json): read on the control node and encrypted on the Pi,
# systemd decrypts them into the read-only credentials directory of the unit (see windfire-calendar.service.j2)
- name: Remove previous encrypted Google OAuth credentials, if any
  file:
    path: "/etc/credstore.encrypted/{{ service_name }}-{{ item }}"
    state: absent
  loop:
    - google-client
    - google-token

- name: Encrypt Google OAuth files with systemd-creds
  command:
    cmd: "systemd-creds encrypt --name={{ service_name }}-{{ item.name }} --with-key=host - /etc/credstore.encrypted/{{ service_name }}-{{ item.name }}"
    stdin: "{{ lookup('ansible.builtin.file', src_dir ~ '/../../app/' ~ item.file) }}"
  loop:
    - { name: google-client, file: credentials.json }
    - { name: google-token, file: token.json }
  no_log: true
  notify: reload systemd

# Task 9: Install systemd unit
- name: Template Windfire Calendar systemd unit
  template:
    src: "{{ src_dir }}/templates/windfire-calendar.service.j2"
    dest: "/etc/systemd/system/{{ service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

# Task 10: Start Windfire Calendar service
- name: Reload systemd, enable and start "{{ service_name }}" service
  systemd:
    daemon_reload: yes
    name: "{{ service_name }}"
    state: started
    enabled: yes

# Task 11: Post-deploy health check
- name: Check Windfire Calendar service health
  block:
    - name: Verify Windfire Calendar is listening on port {{ api_port_secure }}
      wait_for:
        port: "{{ api_port_secure }}"
        host: 127.0.0.1
        timeout: 30

    - name: Call https://{{ health_check_host }}:{{ api_port_secure }}/v1/monitor/health
      uri:
        url: "https://{{ health_check_host }}:{{ api_port_secure }}/v1/monitor/health"
        ca_path: "{{ windfire_ca_dir }}/{{ windfire_ca_root_certificate }}"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 5
      delay: 3
  rescue:
    - name: Get "{{ service_name }}" journal entries
      command: "journalctl -u {{ service_name }} -n 50 --no-pager"
      register: service_journal
      changed_when: false
      failed_when: false

    - name: Get "{{ service_name }}" log file tail
      command: "tail -n 50 {{ remote_windfire_calendar_dir }}/app/logs/{{ service_name }}.log"
      register: service_log
      changed_when: false
      failed_when: false

    - name: Display "{{ service_name }}" diagnostics
      debug:
        msg:
          journal: "{{ service_journal.stdout_lines }}"
          log: "{{ service_log.stdout_lines }}"

    - name: Fail deployment
      fail:
        msg: "{{ service_name }} did not pass the health check, see diagnostics above"
